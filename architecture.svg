<text x="52.0" y="50.0" font-size="26" font-weight="bold" fill="#1b1b1f">LLM inference profiling — where the bottleneck actually sits</text>
<text x="52.0" y="73.0" font-size="13" font-weight="normal" fill="#868e96">Qwen2.5-7B · bf16 · vLLM 0.7.3 · 1x A100-SXM4-80GB</text>
<text x="66.0" y="179.3" font-size="17" font-weight="bold" fill="#1b1b1f">prompt</text>
<text x="66.0" y="200.4" font-size="12" font-weight="normal" fill="#868e96">≤ 8192 tok</text>
<text x="276.0" y="179.3" font-size="17" font-weight="bold" fill="#1b1b1f">PREFILL</text>
<text x="276.0" y="200.4" font-size="12" font-weight="normal" fill="#868e96">compute-bound</text>
<text x="486.0" y="179.3" font-size="17" font-weight="bold" fill="#1b1b1f">KV CACHE</text>
<text x="486.0" y="200.4" font-size="12" font-weight="normal" fill="#868e96">56 KB / tok</text>
<text x="696.0" y="179.3" font-size="17" font-weight="bold" fill="#1b1b1f">DECODE</text>
<text x="696.0" y="200.4" font-size="12" font-weight="normal" fill="#868e96">bandwidth-bound</text>
<text x="906.0" y="179.3" font-size="17" font-weight="bold" fill="#1b1b1f">output</text>
<text x="906.0" y="200.4" font-size="12" font-weight="normal" fill="#868e96">tokens</text>
<text x="446.0" y="282.0" font-size="12" font-weight="normal" fill="#2f9e44">full parameter set re-read from HBM every step</text>
<text x="52.0" y="285.0" font-size="15" font-weight="normal" fill="#e67700">roofline position</text>
<text x="68.0" y="329.0" font-size="16" font-weight="bold" fill="#1971c2">PREFILL</text>
<text x="68.0" y="355.0" font-size="13" font-weight="normal" fill="#1864ab">84% MFU at 8k · 312 TFLOP/s roof</text>
<text x="68.0" y="371.9" font-size="13" font-weight="normal" fill="#1864ab">62883 → 64678 ns/token (+2.9%)</text>
<text x="68.0" y="388.8" font-size="13" font-weight="normal" fill="#1864ab">superlinear: FLOP model says +5.1%</text>
<text x="726.0" y="329.0" font-size="16" font-weight="bold" fill="#2f9e44">DECODE</text>
<text x="726.0" y="355.0" font-size="13" font-weight="normal" fill="#2b8a3e">ITL 12.5 ms flat · roof 7.5 ms</text>
<text x="726.0" y="371.9" font-size="13" font-weight="normal" fill="#2b8a3e">60% of peak bandwidth reached</text>
<text x="726.0" y="388.8" font-size="13" font-weight="normal" fill="#2b8a3e">cost per token independent of length</text>
<text x="52.0" y="471.0" font-size="15" font-weight="normal" fill="#e67700">as concurrency rises</text>
<text x="66.0" y="514.0" font-size="16" font-weight="bold" fill="#2f9e44">c = 1</text>
<text x="66.0" y="539.0" font-size="17" font-weight="bold" fill="#1b1b1f">80 tok/s</text>
<text x="66.0" y="560.0" font-size="12" font-weight="normal" fill="#868e96">60% of peak BW</text>
<text x="66.0" y="576.0" font-size="12" font-weight="normal" fill="#868e96">bandwidth-bound</text>
<text x="471.3" y="514.0" font-size="16" font-weight="bold" fill="#e67700">c = 16</text>
<text x="471.3" y="539.0" font-size="17" font-weight="bold" fill="#1b1b1f">1038 tok/s</text>
<text x="471.3" y="560.0" font-size="12" font-weight="normal" fill="#868e96">weights shared</text>
<text x="471.3" y="576.0" font-size="12" font-weight="normal" fill="#868e96">knee</text>
<text x="876.7" y="514.0" font-size="16" font-weight="bold" fill="#e03131">c = 64</text>
<text x="876.7" y="539.0" font-size="17" font-weight="bold" fill="#1b1b1f">2429 tok/s</text>
<text x="876.7" y="560.0" font-size="12" font-weight="normal" fill="#868e96">33% BW · 12% FLOP</text>
<text x="876.7" y="576.0" font-size="12" font-weight="normal" fill="#868e96">neither roof</text>
<text x="1282.0" y="514.0" font-size="16" font-weight="bold" fill="#e8590c">one c=64 step</text>
<text x="1282.0" y="539.0" font-size="17" font-weight="bold" fill="#1b1b1f">26 ms total</text>
<text x="1282.0" y="560.0" font-size="12" font-weight="normal" fill="#868e96">9 ms memory transfer</text>
<text x="1282.0" y="576.0" font-size="12" font-weight="normal" fill="#e8590c">18 ms engine overhead</text>
<text x="68.0" y="681.0" font-size="15" font-weight="bold" fill="#c92a2a">above ~16 concurrent requests neither roof saturates  →  limited by per-step overhead (18 ms of 26 ms), not by the GPU</text>
<text x="52.0" y="746.0" font-size="12" font-weight="normal" fill="#868e96">TP=1 throughout (no multi-GPU config available)  ·  no kernel counters (Nsight blocked in container)  ·  offline generate() exposes no per-token stream, so mean ITL only</text>
</svg>